sonar.projectKey=mnm-backend
sonar.projectName=Minis Backend (all services)
sonar.sourceEncoding=UTF-8
# Scanner runs from jenkins/sonar/backend-all; analysis root is the monorepo root.
sonar.projectBaseDir=../../..
sonar.sources=gateway/src/main,backend/src/main,store/src/main,commerce/src/main
sonar.tests=gateway/src/test,backend/src/test,store/src/test,commerce/src/test
sonar.java.binaries=gateway/target/classes,backend/target/classes,store/target/classes,commerce/target/classes
sonar.coverage.jacoco.xmlReportPaths=gateway/target/site/jacoco/jacoco.xml,backend/target/site/jacoco/jacoco.xml,store/target/site/jacoco/jacoco.xml,commerce/target/site/jacoco/jacoco.xml
sonar.exclusions=**/target/**,**/*Test*.java,**/node_modules/**,**/application-tls.yml
