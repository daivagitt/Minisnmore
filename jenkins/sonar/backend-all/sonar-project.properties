sonar.projectKey=mnm-backend
sonar.projectName=Minis Backend (all services)
sonar.sourceEncoding=UTF-8
# Scanner runs from jenkins/sonar/backend-all; analysis root is the monorepo root.
sonar.projectBaseDir=../../..
# Coverage gate applies to business-logic service layers (matches JaCoCo focus in CI reports).
# Zoho legacy integration is excluded; Ledgerly/commerce paths are the active business surface.
sonar.sources=services/gateway/src/main/java/com/miniandmore/gateway/service,backend/src/main/java/com/miniandmore/app/service,services/store/src/main/java,services/commerce/src/main/java
sonar.tests=services/gateway/src/test,backend/src/test,services/store/src/test,services/commerce/src/test
sonar.java.binaries=services/gateway/target/classes,backend/target/classes,services/store/target/classes,services/commerce/target/classes
sonar.coverage.jacoco.xmlReportPaths=services/gateway/target/site/jacoco/jacoco.xml,backend/target/site/jacoco/jacoco.xml,services/store/target/site/jacoco/jacoco.xml,services/commerce/target/site/jacoco/jacoco.xml
sonar.exclusions=**/target/**,**/*Test*.java,**/node_modules/**,**/application-tls.yml,**/Zoho*.java
sonar.coverage.exclusions=**/Zoho*.java,**/*Scheduler.java
