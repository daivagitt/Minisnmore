<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini's n More — Customer, Admin & Delivery wireframes</title>
  <style>
    :root {
      --ink: #2b2428;
      --muted: #6d6468;
      --line: #d8d0d3;
      --paper: #f6f2f0;
      --white: #fff;
      --accent: #8b4557;
      --accent-soft: #f3e6ea;
      --ok: #2f6b4f;
      --ok-soft: #e6f3ec;
      --warn: #8a5a16;
      --warn-soft: #f8eedd;
      --info: #3d5a73;
      --info-soft: #e7eef4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    header.app {
      position: sticky; top: 0; z-index: 20;
      background: var(--white);
      border-bottom: 1px solid var(--line);
      padding: 12px 20px;
      display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    }
    header.app h1 { font-size: 16px; margin: 0; font-weight: 650; }
    header.app p { margin: 0; color: var(--muted); font-size: 12px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
    .tabs button, .flow-nav button, .screen-nav button {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      font: inherit;
    }
    .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    main { display: grid; grid-template-columns: 280px 1fr 300px; min-height: calc(100vh - 58px); }
    @media (max-width: 1100px) { main { grid-template-columns: 1fr; } .aside { border-right: 0; border-bottom: 1px solid var(--line); } }
    .aside, .notes {
      background: var(--white);
      padding: 16px;
    }
    .aside { border-right: 1px solid var(--line); }
    .notes { border-left: 1px solid var(--line); }
    .aside h2, .notes h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
    .flow-nav, .screen-nav { display: flex; flex-direction: column; gap: 6px; }
    .flow-nav button, .screen-nav button { border-radius: 8px; text-align: left; }
    .flow-nav button.active, .screen-nav button.active { border-color: var(--accent); background: var(--accent-soft); }
    .stage { padding: 24px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
    .caption { width: min(920px, 100%); }
    .caption h3 { margin: 0 0 4px; font-size: 18px; }
    .caption p { margin: 0; color: var(--muted); }
    .frame-phone {
      width: 360px; min-height: 640px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 12px 12px 20px;
      box-shadow: 0 0 0 8px #efe8ea;
    }
    .frame-desk {
      width: min(920px, 100%);
      min-height: 560px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .chrome {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 4px 12px; font-size: 12px; color: var(--muted);
    }
    .logo { font-weight: 700; color: var(--accent); letter-spacing: .04em; }
    .block { border: 1px dashed var(--line); border-radius: 10px; padding: 10px; margin: 8px 0; }
    .hero { height: 120px; background: var(--accent-soft); border-radius: 12px; display: grid; place-items: center; color: var(--accent); font-weight: 600; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .tile { height: 72px; background: #f3eeef; border-radius: 10px; display: grid; place-items: center; font-size: 12px; text-align: center; padding: 6px; }
    .btn {
      display: block; width: 100%; text-align: center; border: 0; border-radius: 999px;
      padding: 10px; margin-top: 8px; background: var(--accent); color: #fff; cursor: pointer; font: inherit;
    }
    .btn.ghost { background: var(--white); color: var(--ink); border: 1px solid var(--line); }
    .btn.warn { background: var(--warn); }
    .btn.ok { background: var(--ok); }
    .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--info-soft); color: var(--info); }
    .pill.ok { background: var(--ok-soft); color: var(--ok); }
    .pill.warn { background: var(--warn-soft); color: var(--warn); }
    .pill.accent { background: var(--accent-soft); color: var(--accent); }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item { border: 1px solid var(--line); border-radius: 10px; padding: 10px; cursor: pointer; }
    .item:hover { border-color: var(--accent); }
    .muted { color: var(--muted); font-size: 12px; }
    .steps { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin: 10px 0 16px; }
    .steps span { flex: 1; text-align: center; position: relative; }
    .steps span.on { color: var(--accent); font-weight: 650; }
    .desk-bar { display: flex; border-bottom: 1px solid var(--line); }
    .desk-nav { width: 180px; border-right: 1px solid var(--line); padding: 12px; font-size: 12px; }
    .desk-nav div { padding: 6px 8px; border-radius: 6px; margin-bottom: 2px; }
    .desk-nav .on { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
    .desk-body { flex: 1; padding: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 550; }
    .notes ul { margin: 0; padding-left: 16px; color: var(--muted); }
    .notes li { margin: 0 0 8px; }
    .hidden { display: none; }
    .callout { background: var(--warn-soft); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
    .timeline { border-left: 2px solid var(--line); margin: 8px 0 0 8px; padding-left: 12px; }
    .timeline div { margin: 0 0 10px; }
    .timeline .now { color: var(--accent); font-weight: 650; }
    a.link { color: var(--accent); cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <header class="app">
    <div>
      <h1>Journey wireframes for the call</h1>
      <p>Discussion deck · Mini's n More · Customer · Admin · Delivery · lo-fi, not visual design · <a href="/reports/">UAT reports</a> · <a href="../../report.html">Repo dashboard</a></p>
    </div>
    <div class="tabs" id="journeyTabs"></div>
  </header>
  <main>
    <aside class="aside">
      <h2>Screens</h2>
      <div class="screen-nav" id="screenNav"></div>
    </aside>
    <section class="stage">
      <div class="caption">
        <h3 id="screenTitle"></h3>
        <p id="screenBlurb"></p>
      </div>
      <div id="canvas"></div>
    </section>
    <aside class="notes">
      <h2>Talking points</h2>
      <div id="talking"></div>
    </aside>
  </main>

    function phone(inner) {
      return `<div class="frame-phone"><div class="muted" style="text-align:center">9:41</div>${inner}</div>`;
    }
    function desk(navOn, inner) {
      const items = ["Dashboard","Orders","Cancellations","Order returns","Users"];
      const nav = items.map(i => `<div class="${i===navOn || (navOn||'').startsWith(i) ? 'on':''}">${i}</div>`).join("");
      return `<div class="frame-desk"><div class="desk-bar"><div class="desk-nav"><div class="logo">Admin</div>${nav}</div><div class="desk-body">${inner}</div></div></div>`;
    }

    let journey = "customer";
    let screenId = journeys.customer.screens[0].id;

    function renderTabs() {
      document.getElementById("journeyTabs").innerHTML = Object.entries(journeys).map(([k,v]) =>
        `<button class="${k===journey?'active':''}" data-j="${k}">${v.label}</button>`
      ).join("");
    }
    function currentScreens() { return journeys[journey].screens; }
    function currentScreen() { return currentScreens().find(s => s.id === screenId) || currentScreens()[0]; }

    function renderNav() {
      document.getElementById("screenNav").innerHTML = currentScreens().map(s =>
        `<button class="${s.id===screenId?'active':''}" data-s="${s.id}">${s.title}</button>`
      ).join("");
    }
    function renderScreen() {
      const s = currentScreen();
      screenId = s.id;
      document.getElementById("screenTitle").textContent = s.title;
      document.getElementById("screenBlurb").textContent = s.blurb;
      document.getElementById("canvas").innerHTML = s.html;
      document.getElementById("talking").innerHTML = "<ul>" + s.talk.map(t => `<li>${t}</li>`).join("") + "</ul>";
    }
    function go(id) {
      for (const [jk, j] of Object.entries(journeys)) {
        if (j.screens.some(s => s.id === id)) { journey = jk; screenId = id; break; }
      }
      paint();
    }
    function paint() {
      renderTabs(); renderNav(); renderScreen();
    }

    document.body.addEventListener("click", (e) => {
      const t = e.target.closest("[data-j],[data-s],[data-go]");
      if (!t) return;
      if (t.dataset.j) { journey = t.dataset.j; screenId = journeys[journey].screens[0].id; paint(); }
      if (t.dataset.s) { screenId = t.dataset.s; paint(); }
      if (t.dataset.go) go(t.dataset.go);
    });

    paint();
  </script>
