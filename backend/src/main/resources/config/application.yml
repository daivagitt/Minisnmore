---
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

application:
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
      key-prefix: ${S3_KEY_PREFIX:${R2_KEY_PREFIX:}}
      max-upload-bytes: ${S3_MAX_UPLOAD_BYTES:8192000}
  internal-api-key: ${INTERNAL_API_KEY:}
  zoho:
    sync-product-images: ${ZOHO_SYNC_PRODUCT_IMAGES:true}
    sync-product-stock: ${ZOHO_SYNC_PRODUCT_STOCK:true}
    sync-returns: ${ZOHO_SYNC_RETURNS:false}
    pull-products-auto-create-category: ${ZOHO_PULL_PRODUCTS_AUTO_CREATE_CATEGORY:false}
    auto-sync-enabled: ${ZOHO_AUTO_SYNC_ENABLED:false}
    default-location-id: ${ZOHO_DEFAULT_LOCATION_ID:}
    default-location-name: ${ZOHO_DEFAULT_LOCATION_NAME:Head Office}
    inventory-account-id: ${ZOHO_INVENTORY_ACCOUNT_ID:}
    inventory-adjustment-account-id: ${ZOHO_INVENTORY_ADJUSTMENT_ACCOUNT_ID:}
    gst-tax-id: ${ZOHO_GST_TAX_ID:}
    product-fields:
      fabric-type-label: ${ZOHO_FIELD_FABRIC_TYPE:Fabric Type}
      sizes-label: ${ZOHO_FIELD_SIZES:sizes}
      age-min-label: ${ZOHO_FIELD_AGE_MIN:age}
      age-max-label: ${ZOHO_FIELD_AGE_MAX:Age Max (months)}
      category-label: ${ZOHO_FIELD_CATEGORY:category}
      mrp-api-name: ${ZOHO_FIELD_MRP_API_NAME:label_rate}
    order-retry:
      fixed-delay-ms: ${ZOHO_ORDER_RETRY_FIXED_DELAY_MS:600000}
    order-tracking:
      fixed-delay-ms: ${ZOHO_ORDER_TRACKING_FIXED_DELAY_MS:900000}
    oauth:
      homepage-url: ${ZOHO_OAUTH_HOMEPAGE_URL:http://localhost:5173}
      redirect-uris:
        - ${ZOHO_OAUTH_REDIRECT_URI:http://localhost:5173}
        - ${ZOHO_OAUTH_ADMIN_REDIRECT_URI:http://localhost:5173/admin/zoho}
      javascript-domains:
        - ${ZOHO_OAUTH_JAVASCRIPT_DOMAIN:http://localhost:5173}
        - ${ZOHO_OAUTH_JAVASCRIPT_DOMAIN_ALT:http://127.0.0.1:5173}
      scopes: ${ZOHO_OAUTH_SCOPES:ZohoBooks.fullaccess.all}
      client-id: ${ZOHO_CLIENT_ID:}
      client-secret: ${ZOHO_CLIENT_SECRET:}
      org-id: ${ZOHO_ORG_ID:}
      default-data-center: ${ZOHO_DATA_CENTER:in}
  ledgerly:
    api-base-url: ${LEDGERLY_API_BASE_URL:https://lender.qualityoutsidethebox.org/api}
    api-token: ${LEDGERLY_API_TOKEN:}
    org-id: ${LEDGERLY_ORG_ID:}
    webhook-secret: ${LEDGERLY_WEBHOOK_SECRET:}
    sync-product-images: ${LEDGERLY_SYNC_PRODUCT_IMAGES:false}
    sync-returns: ${LEDGERLY_SYNC_RETURNS:false}
    auto-sync-enabled: ${LEDGERLY_AUTO_SYNC_ENABLED:false}
    auto-pull-enabled: ${LEDGERLY_AUTO_PULL_ENABLED:false}
    schedulers:
      retry-orders-ms: ${LEDGERLY_ORDER_RETRY_MS:300000}
      pull-tracking-ms: ${LEDGERLY_ORDER_TRACKING_MS:3600000}
      pull-inventory-ms: ${LEDGERLY_INVENTORY_PULL_MS:3600000}
  inventory:
    reservation-release:
      fixed-delay-ms: ${INVENTORY_RESERVATION_RELEASE_FIXED_DELAY_MS:300000}
  xpressbees:
    base-url: ${XPRESSBEES_BASE_URL:https://shipment.xpressbees.com}
    email: ${XPRESSBEES_EMAIL:}
    password: ${XPRESSBEES_PASSWORD:}
    origin-pincode: ${XPRESSBEES_ORIGIN_PINCODE:560074}
    payment-type: ${XPRESSBEES_PAYMENT_TYPE:prepaid}
  fastsms:
    enabled: ${FASTSMS_ENABLED:false}
    base-url: ${FASTSMS_BASE_URL:https://s.fastsmsindia.com/api/sms/v1.0}
    access-token: ${FASTSMS_ACCESS_TOKEN:}
    access-token-key: ${FASTSMS_ACCESS_TOKEN_KEY:}
    sms-header: ${FASTSMS_SMS_HEADER:MININM}
    route: ${FASTSMS_ROUTE:transactional}
    entity-id: ${FASTSMS_ENTITY_ID:1701178669941271239}
    template-id: ${FASTSMS_TEMPLATE_ID:}
    expire-seconds: ${FASTSMS_EXPIRE_SECONDS:3600}
    # DLT message bodies live as Java defaults in ApplicationProperties.FastSms.Templates
    # (brace placeholders like {name} must not appear inside ${ENV:default} YAML defaults).
    templates:
      order-confirmed-template-id: ${FASTSMS_TMPL_ORDER_CONFIRMED_ID:1777178696636494530}
      order-cancelled-template-id: ${FASTSMS_TMPL_ORDER_CANCELLED_ID:1777178696692470339}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  payment-demo: ${RAZORPAY_PAYMENT_DEMO:false}
