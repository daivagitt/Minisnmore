# Production profile — catalog core (internal :8084, no public exposure).

logging:
  level:
    ROOT: INFO
    tech.jhipster: WARN
    com.miniandmore.app: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ROLE_ADMIN
  prometheus:
    metrics:
      export:
        enabled: ${PROMETHEUS_ENABLED:false}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.1}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  cloud:
    consul:
      discovery:
        prefer-ip-address: true
        tags:
          - profile=prod
          - version=@project.version@
      host: ${CONSUL_HOST:127.0.0.1}
      port: ${CONSUL_PORT:8500}
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/miniandmore}
    username: ${SPRING_DATASOURCE_USERNAME:miniandmore}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      poolName: HikariCatalog
      auto-commit: false
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      max-lifetime: 1800000
      connection-timeout: 30000
      idle-timeout: 600000
  liquibase:
    contexts: prod
  mail:
    host: ${SPRING_MAIL_HOST:smtp.zoho.in}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
  thymeleaf:
    cache: true

server:
  port: ${SERVER_PORT:8084}
  address: ${SERVER_ADDRESS:127.0.0.1}
  shutdown: graceful
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

jhipster:
  mail:
    base-url: ${JHIPSTER_MAIL_BASE_URL:https://minisnmore.com}
    from: ${JHIPSTER_MAIL_FROM:${SPRING_MAIL_USERNAME:}}
  http:
    cache:
      timeToLiveInDays: 1461
  cache:
    redis:
      expiration: 3600
      server: ${JHIPSTER_CACHE_REDIS_SERVER:redis://127.0.0.1:6379}
      cluster: false
  security:
    authentication:
      jwt:
        token-validity-in-seconds: ${JWT_TOKEN_VALIDITY_SECONDS:86400}
        token-validity-in-seconds-for-remember-me: ${JWT_REMEMBER_ME_VALIDITY_SECONDS:2592000}
  logging:
    use-json-format: ${LOG_JSON:true}
    logstash:
      enabled: ${LOGSTASH_ENABLED:false}
      host: ${LOGSTASH_HOST:127.0.0.1}
      port: ${LOGSTASH_PORT:5000}
      ring-buffer-size: 512

application:
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
      key-prefix: ${S3_KEY_PREFIX:}
  ledgerly:
    api-base-url: ${LEDGERLY_API_BASE_URL:}
    api-token: ${LEDGERLY_API_TOKEN:}
    org-id: ${LEDGERLY_ORG_ID:}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  payment-demo: ${RAZORPAY_PAYMENT_DEMO:false}
  refund-demo: ${RAZORPAY_REFUND_DEMO:false}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
