<!DOCTYPE html>
<!-- Item rows: context "items" is built by OrderMailService#lineItemRow (name/title, qty/quantity, details, image, exchangeNote). -->
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <table th:fragment="card(heading)" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fdf1ec; border-radius:14px; margin:0 0 16px 0;" th:if="${items != null and !items.isEmpty()}">
    <tr>
      <td style="padding:18px 24px;">
        <div style="font-size:12px; color:#8a7472; margin-bottom:10px; font-weight:bold; letter-spacing:0.04em;" th:text="${heading}">ITEMS</div>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" th:each="item, iterStat : ${items}" th:style="${iterStat.last} ? '' : 'margin-bottom:12px; padding-bottom:12px; border-bottom:1px dashed #f0d8de;'">
          <tr>
            <td width="44" style="vertical-align:top;">
              <img th:if="${!#strings.isEmpty(item.image)}" th:src="${item.image}" th:alt="${!#strings.isEmpty(item.name) ? item.name : item.title}" width="40" height="40" style="width:40px; height:40px; object-fit:cover; border-radius:8px; display:block; border:1px solid #f6dce2;" />
              <div th:if="${#strings.isEmpty(item.image)}" style="width:40px; height:40px; background-color:#fbdbe5; border-radius:8px; color:#c2447a; font-weight:bold; font-size:18px; text-align:center; line-height:40px;" th:text="${#strings.isEmpty(item.name) ? (#strings.isEmpty(item.title) ? 'M' : #strings.substring(item.title, 0, 1)) : #strings.substring(item.name, 0, 1)}">D</div>
            </td>
            <td style="padding-left:12px; vertical-align:top;">
              <div style="font-size:14px; color:#333; font-weight:bold;" th:text="${!#strings.isEmpty(item.name) ? item.name : item.title}">Product</div>
              <div style="font-size:13px; color:#8a7472;">
                <span th:if="${!#strings.isEmpty(item.details)}" th:text="${item.details} + ' · '">Size · colour · </span>Qty <span th:text="${!#strings.isEmpty(item.qty) ? item.qty : item.quantity}">1</span>
              </div>
              <div th:if="${!#strings.isEmpty(item.exchangeNote)}" style="font-size:13px; color:#c2447a; margin-top:2px;" th:text="'Replacement: ' + ${item.exchangeNote}">Replacement</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
