<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
  <head>
    <title th:text="#{email.order.delivered.title(${orderNumber})}">Order delivered</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body style="margin:0;padding:0;background:#f4eff1;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#4a3f45">
    <span th:text="#{email.order.delivered.preheader(${orderNumber})}" style="display:none!important;visibility:hidden;opacity:0;color:transparent;height:0;width:0;overflow:hidden">Your order has been delivered.</span>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f4eff1;padding:24px 12px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;background:#fff;border-radius:12px;border:1px solid #ece0e4;overflow:hidden">
          <tr><td style="background:#1c1417;padding:22px 26px;color:#fff">
            <table role="presentation" width="100%"><tr>
              <td style="font-size:16px;font-weight:bold;letter-spacing:.14em;text-transform:uppercase">Minis n More</td>
              <td align="right"><strong th:text="#{email.order.delivered.subheading}">Delivery Update</strong><div style="color:#cbb9c1;margin-top:2px"><span th:text="#{email.order.label.number}">Order</span> <span style="color:#fff" th:text="${orderNumber}">MNM-000</span></div></td>
            </tr></table>
          </td></tr>
          <tr><td style="padding:26px 26px 4px;font-size:15px;line-height:1.7;color:#5f4f56">
            <p style="margin:0 0 14px" th:text="#{email.order.greeting(${customerName})}">Dear Customer,</p>
            <p style="margin:0 0 4px;font-size:20px;font-weight:bold;color:#3a2e34" th:text="#{email.order.delivered.headline}">Delivered with care</p>
            <p style="margin:8px 0 0" th:text="#{email.order.delivered.intro(${orderNumber})}">Your order has reached you.</p>
          </td></tr>
          <tr><td style="padding:18px 26px 0">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f7f4f5;border-radius:10px"><tr>
              <td style="padding:18px 20px;font-size:13px;line-height:1.9;color:#5f4f56">
                <div><strong th:text="#{email.order.label.number}">Order</strong> <span style="color:#c77d98;font-weight:bold" th:text="${orderNumber}">MNM-000</span></div>
                <div><strong th:text="#{email.order.label.deliveredTo}">Delivered to</strong> <span th:text="${!#strings.isEmpty(addressName)} ? ${addressName} : ${customerName}">Customer</span></div>
              </td>
              <td align="right" style="padding:18px 20px"><a th:href="${orderUrl}" th:text="#{email.order.cta.short}" style="display:inline-block;background:#1c1417;color:#fff;text-decoration:none;font-size:13px;font-weight:bold;padding:12px 20px;border-radius:6px;white-space:nowrap">View Order</a></td>
            </tr></table>
          </td></tr>
          <tr><td style="padding:20px 26px 0;font-size:14px;line-height:1.7;color:#5f4f56"><p style="margin:0" th:text="#{email.order.delivered.after}">Thank you for choosing Minis n More.</p></td></tr>
          <tr><td style="padding:16px 26px 0;font-size:14px;line-height:1.7;color:#5f4f56"><p style="margin:0 0 4px" th:text="#{email.order.closing}">Warm regards,</p><p style="margin:0;font-weight:bold" th:text="#{email.signature}">Team Minis n More</p></td></tr>
          <tr><td style="padding:22px 26px;font-size:12px;line-height:1.7;color:#9a7f8d"><p style="margin:0" th:text="#{email.order.footer.note(${supportEmail})}">For help, write to us.</p></td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
