server:
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/miniandmore}
    username: ${SPRING_DATASOURCE_USERNAME:miniandmore}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  liquibase:
    enabled: false
  cloud:
    consul:
      host: ${CONSUL_HOST:127.0.0.1}
      port: ${CONSUL_PORT:8500}

application:
  internal-api-key: ${INTERNAL_API_KEY:}
