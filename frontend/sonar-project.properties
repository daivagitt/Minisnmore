sonar.projectKey=frontend
sonar.projectName=Mini's n More Frontend
# Coverage gate applies to Vitest-scoped modules only (matches vitest.config.ts coverage.include).
# Analyzing the full app would show ~18% because lcov covers only these files.
sonar.sources=src/lib/api.ts,src/lib/pincode.ts,src/lib/product-fit.ts,src/lib/coupons.functions.ts,src/lib/orders.functions.ts,src/hooks/useAuth.tsx,src/store/shop.tsx,src/routes/login.tsx,src/routes/admin.login.tsx
sonar.tests=src
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/routeTree.gen.ts,**/router.tsx,**/styles.css,**/assets/**,**/data/**,**/*.d.ts
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
