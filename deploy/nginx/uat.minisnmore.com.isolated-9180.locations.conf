# UAT Nginx — isolated microservices gateway on 127.0.0.1:9180
# (Monolith API remains on :8081 but is NOT used once this config is active.)
#
# Replace 8080 → 9180 in your live site, or copy these blocks into the HTTPS server { } for uat.minisnmore.com.

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:9180/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /oauth2/ {
        proxy_pass http://127.0.0.1:9180/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /login/oauth2/ {
        proxy_pass http://127.0.0.1:9180/login/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location = /v3/api-docs {
        proxy_pass http://127.0.0.1:9184/v3/api-docs/catalog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location = /v3/api-docs/gateway {
        proxy_pass http://127.0.0.1:9180/v3/api-docs/gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /v3/api-docs/gateway/ {
        proxy_pass http://127.0.0.1:9180/v3/api-docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /v3/api-docs/ {
        proxy_pass http://127.0.0.1:9184/v3/api-docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location = /swagger-ui.html {
        proxy_pass http://127.0.0.1:9184/swagger-ui.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location = /swagger-ui {
        return 301 /swagger-ui/index.html;
    }

    location = /swagger-ui/ {
        return 301 /swagger-ui/index.html;
    }

    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:9184/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /management/ {
        proxy_pass http://127.0.0.1:9180/management/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
