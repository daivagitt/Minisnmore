# Production Nginx — isolated microservices gateway on 127.0.0.1:9180
# (Monolith API remains on :8081 but is NOT used once this config is active.)
#
# Replace 8080 → 9180 in your live site, or copy these blocks into the HTTPS server { } for minisnmore.com.

    client_max_body_size 10m;

    # Zoho admin (bulk sync, pull inventory) can run several minutes — must exceed gateway integration timeout.
    location /api/v1/admin/zoho/ {
        proxy_pass http://127.0.0.1:9180/api/v1/admin/zoho/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /api/v1/admin/zoho-settings {
        proxy_pass http://127.0.0.1:9180/api/v1/admin/zoho-settings;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

