# Production Nginx — isolated microservices gateway on 127.0.0.1:9180
# (Monolith API remains on :8081 but is NOT used once this config is active.)
#
# Replace 8080 → 9180 in your live site, or copy these blocks into the HTTPS server { } for minisnmore.com.

    client_max_body_size 80m;

    # Google Search reads these files directly. Serve them from disk with a public
    # cache so they are not wrapped in the storefront's no-store HTML responses.
    location ~* ^/(favicon\.ico|favicon-[0-9]+x[0-9]+\.png|icon-[0-9]+\.png|apple-touch-icon\.png|og-share\.jpg|robots\.txt|sitemap\.xml|site\.webmanifest)$ {
        root /var/www/uat1/mini_ms_test/frontend/public;
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        types {
            image/x-icon ico;
            image/png png;
            image/jpeg jpg;
            text/plain txt;
            application/xml xml;
            application/manifest+json webmanifest;
        }
        default_type application/octet-stream;
    }

    # Zoho admin (bulk sync, pull inventory) can run several minutes — must exceed gateway integration timeout.
    location /api/v1/admin/zoho/ {
        proxy_pass http://127.0.0.1:9180/api/v1/admin/zoho/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /api/v1/admin/zoho-settings {
        proxy_pass http://127.0.0.1:9180/api/v1/admin/zoho-settings;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
