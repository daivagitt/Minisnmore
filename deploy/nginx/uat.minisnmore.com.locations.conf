# UAT Nginx locations for uat.minisnmore.com
# Isolated gateway (PM2 mini-uat-ms-gateway): 127.0.0.1:9180 — public API, OAuth, OpenAPI
# Store / Commerce / Integration:             127.0.0.1:9181–9183 — internal (via gateway only)
# Catalog core (PM2 mini-uat-ms-catalog-core): 127.0.0.1:9184 — internal only
# Frontend (PM2 mini-uat-frontend):           127.0.0.1:3000
# Monolith on :8081 is NOT proxied here. Rollback to :8080: deploy/scripts/uat-nginx-cutover-isolated.sh --rollback
#
# Add these inside the HTTPS server { } block for uat.minisnmore.com,
# BEFORE "location / { ... proxy_pass frontend ... }".
# Optional: include deploy/nginx/security-headers.conf in this server block.

    # Allow multipart admin uploads through nginx (default is 1m). Presigned uploads
    # send the file directly to R2 and only hit /api/ for a small JSON presign call.
    client_max_body_size 10m;

    # Zoho admin (bulk sync, pull inventory) can run several minutes — must exceed gateway integration timeout.
    location /api/v1/admin/zoho/ {
        proxy_pass http://127.0.0.1:9180/api/v1/admin/zoho/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /api/v1/admin/zoho-settings {
        proxy_pass http://127.0.0.1:9180/api/v1/admin/zoho-settings;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9180/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /oauth2/ {
        proxy_pass http://127.0.0.1:9180/oauth2/;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /login/oauth2/ {
        proxy_pass http://127.0.0.1:9180/login/oauth2/;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /v3/api-docs {
        proxy_pass http://127.0.0.1:9180/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:9180/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /management/ {
        proxy_pass http://127.0.0.1:9180/management/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Jenkins static reports (DEPLOY_REPORTS → /var/www/uat1/mini_reports/current)
    location /reports/ {
        alias /var/www/uat1/mini_reports/current/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Frontend (vite preview / TanStack Start) — disable caching of HTML so deploys show immediately.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
