<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
  <head>
    <title th:text="#{email.invitation.title}">Invitation</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  </head>
  <body>
    <p th:text="#{email.invitation.greeting(${user.login})}">Dear</p>
    <p th:text="${assignedRole}">Role</p>
    <p>
      <a th:with="url=(@{|${baseUrl}/invite?key=${user.activationKey}|})" th:href="${url}" th:text="${url}">Invite link</a>
    </p>
  </body>
</html>
