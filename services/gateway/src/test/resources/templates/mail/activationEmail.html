<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
  <head>
    <title th:text="#{email.activation.title}">Account activation</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  </head>
  <body
    th:with="customerName=${!#strings.isEmpty(user.firstName) ? user.firstName : user.login}, activationUrl=(@{|${baseUrl}/activate?key=${user.activationKey}|})"
  >
    <p th:text="#{email.activation.greeting(${customerName})}">Dear</p>
    <p th:text="#{email.activation.intro}">Your account is ready.</p>
    <p>
      <a th:href="${activationUrl}" th:text="${activationUrl}">Activation link</a>
    </p>
    <p th:text="#{email.signature}">Team Minis n More</p>
  </body>
</html>
