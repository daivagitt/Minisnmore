<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
  <head>
    <title th:text="#{email.reset.title}">Password reset</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  </head>
  <body
    th:with="customerName=${!#strings.isEmpty(user.firstName) ? user.firstName : user.login}, resetUrl=(@{|${baseUrl}/account/reset/finish?key=${user.resetKey}|})"
  >
    <p th:text="#{email.reset.greeting(${customerName})}">Dear</p>
    <p th:text="#{email.reset.intro}">Reset your password.</p>
    <p>
      <a th:href="${resetUrl}" th:text="${resetUrl}">Reset link</a>
    </p>
    <p th:text="#{email.signature}">Team Minis n More</p>
  </body>
</html>
