# UAT profile: route to local edge services without relying on Consul discovery.
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: miniandmore-ledgerly-webhooks
              uri: http://127.0.0.1:8084
              predicates:
                - Path=/internal/v1/ledgerly/webhooks
            - id: miniandmore-zoho-stock-webhooks
              uri: http://127.0.0.1:8084
              predicates:
                - Path=/internal/v1/zoho/stock-webhook
            - id: miniandmore-zoho-shipment-webhooks
              uri: http://127.0.0.1:8084
              predicates:
                - Path=/internal/v1/zoho/shipment-webhook
            - id: miniandmore-ledgerly-api
              uri: http://127.0.0.1:8081
              predicates:
                - Path=/api/v1/admin/ledgerly/**
            - id: miniandmore-zoho-api
              uri: http://127.0.0.1:8081
              predicates:
                - Path=/api/v1/admin/zoho/**,/api/v1/admin/zoho-settings
              metadata:
                response-timeout: 600000
                connect-timeout: 5000
            - id: miniandmore-commerce-api
              uri: http://127.0.0.1:8082
              predicates:
                - Path=/api/v1/orders/**,/api/v1/account/**,/api/v1/payments,/api/v1/coupons/**,/api/v1/order-returns/**,/api/v1/admin/order-returns/**
            - id: miniandmore-store-api
              uri: http://127.0.0.1:8081
              predicates:
                - Path=/api/v1/**
